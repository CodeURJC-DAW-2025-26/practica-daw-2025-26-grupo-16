server.port = 8443
server.ssl.key-store = classpath:keystore.jks
server.ssl.key-store-password = password
server.ssl.key-password = password

spring.mustache.suffix=.html

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/DAW16}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Daw2026}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create}

# Necessary to be able to use accents and the letter ñ
spring.servlet.encoding.charset=UTF-8 
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


springdoc.api-docs.path= /v3/api-docs
springdoc.swagger-ui.path= /swagger-ui.html

# Error handling
server.error.path=/error
server.error.whitelabel.enabled=false
spring.web.resources.add-mappings=true