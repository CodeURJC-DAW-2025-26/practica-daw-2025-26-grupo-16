<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PowerGym</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/css/styles.css" />
	</head>
	<body class="background-image">
		<header class="header">
			<nav class="navbar navbar-expand-lg">
				<div class="container-fluid">
					<span class="logo">⚡ PowerGym</span>

					<button
						class="navbar-toggler"
						type="button"
						data-bs-toggle="collapse"
						data-bs-target="#powergymNav"
						aria-controls="powergymNav"
						aria-expanded="false"
						aria-label="Toggle navigation"
					>
						<span class="navbar-toggler-icon"></span>
					</button>

					<div class="collapse navbar-collapse" id="powergymNav">
						<div
							class="ms-auto d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0"
						>
							<a href="/" class="btn btn-primary">Home</a>
							<a href="/nutritions" class="btn btn-primary">Nutritions</a>
							<a href="/trainings" class="btn btn-primary">Trainings</a>

							{{^logged}}
							<a href="/login" class="btn btn-primary">Log In</a>
							<a href="/register" class="btn btn-primary">Register</a>
							{{/logged}} {{#logged}} {{#admin}}
							<a href="/admin/users" class="btn btn-primary">Users</a>
							{{/admin}}
							<a href="/progress" class="btn btn-primary">Progress</a>
							<a href="/profileUser" class="btn btn-primary">Profile</a>

							<form action="/logout" method="post" class="d-inline">
								<input type="hidden" name="_csrf" value="{{token}}" />
								<button type="submit" class="btn btn-primary">Log Out</button>
							</form>
							{{/logged}}
						</div>
					</div>
				</div>
			</nav>
		</header>
	</body>
</html>
