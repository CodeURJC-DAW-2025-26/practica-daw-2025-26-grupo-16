<!DOCTYPE html>
<html>

<head>
    <title>PowerGym</title>

    <meta charset="UTF-8">
    <base href=".">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="/css/styles.css" />
</head>


<body>

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark px-3">

        <a class="navbar-brand fw-bold" href="/">⚡ PowerGym</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarContent">

            <div class="d-flex flex-column flex-lg-row gap-2 align-items-lg-center">

                <a href="/" class="btn btn-primary">Home</a>
                <a href="/nutritions" class="btn btn-primary">Nutritions</a>
                <a href="/trainings" class="btn btn-primary">Trainings</a>

                {{^logged}}
                    <a href="/login" class="btn btn-primary">Log In</a>
                    <a href="/register" class="btn btn-primary">Register</a>
                {{/logged}}

                {{#logged}}
                    <a href="/progress" class="btn btn-primary">Progress</a>
                    <a href="/profileUser" class="btn btn-primary">Profile</a>

                    <form action="/logout" method="post" class="d-inline">
                        <button type="submit" class="btn btn-primary">Log Out</button>
                        <input type="hidden" name="_csrf" value="{{token}}" />
                    </form>
                {{/logged}}

            </div>

        </div>
    </nav>

    <div class="container">
