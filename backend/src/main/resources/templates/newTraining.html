{{>header}}

<form
	action="/createTraining"
	method="post"
	enctype="multipart/form-data"
	class="container mt-5 mb-5"
>
	<h2 class="text-center mt-5 mb-4">Create New Training</h2>

	<div class="diet-container">
		<div class="diet-image">
			<div class="card mb-4">
				<label class="form-label fw-bold">Training Image</label>
				<input
					type="file"
					name="imageField"
					class="form-control"
					accept=".jpg, .jpeg, .png"
				/>
			</div>
		</div>

		<div class="diet-info">
			<div class="card mb-3">
				<div class="card-body">
					<label class="form-label fw-bold" for="name">Training Name</label>
					<input
						id="name"
						type="text"
						name="name"
						class="form-control"
						placeholder="Name of the training plan"
						required
					/>
				</div>
			</div>

			<div class="card mb-3">
				<div class="card-body">
					<label class="form-label fw-bold" for="time"
						>Duration (minutes)</label
					>
					<input
						id="time"
						type="number"
						name="time"
						class="form-control"
						min="1"
						placeholder="Duration in minutes"
						required
					/>
				</div>
			</div>

			<div class="card mb-3">
				<div class="card-body">
					<label class="form-label fw-bold" for="goal">Training Goal</label>
					<input
						id="goal"
						type="text"
						name="goal"
						class="form-control"
						placeholder="Example: Build strength"
						required
					/>
				</div>
			</div>

			<div class="card mb-3">
				<div class="card-body">
					<label class="form-label fw-bold" for="description"
						>Exercises of the Training</label
					>
					<textarea
						id="description"
						name="description"
						class="form-control"
						rows="6"
						placeholder="Describe the training exercises"
						required
					></textarea>
				</div>
			</div>

			<input type="hidden" name="_csrf" value="{{token}}" />

			<div class="btn-row">
				<button type="submit" class="btn btn-primary me-2">Create</button>
				<a href="/trainings" class="btn btn-primary">Cancel</a>
			</div>
		</div>
	</div>
</form>

{{>footer}}
