{{>header}}

<div class="container-center">
	<div class="card" style="max-width: 420px; width: 100%; margin: 50px auto">
		<h1 class="background-title">⚡POWERGYM</h1>
		<div class="card-body">
			<h3 class="text-center mb-3 text-white">Create your account</h3>
			<form id="registerForm" action="/register" method="POST">
				
				<div class="mb-3">
					<label class="form-label">Full Name</label>
					<input
						type="text"
						name="fullName"
						class="form-control"
						placeholder="John Doe"
						required
					/>
				</div>

				<div class="mb-3">
					<label class="form-label">Email</label>
					<input
						type="email"
						name="username"
						class="form-control"
						placeholder="example@email.com"
						required
					/>
				</div>

				<div class="mb-3">
					<label class="form-label">Password</label>
					<input
						type="password"
						name="password"
						class="form-control"
						placeholder="********"
						required
					/>
				</div>

				<div class="mb-3">
					<label class="form-label">Confirm Password</label>
					<input
						type="password"
						name="confirmPassword"
						class="form-control"
						placeholder="********"
						required
					/>
				</div>

				{{#token}}
				<input type="hidden" name="_csrf" value="{{token}}" />
				{{/token}}

				<button type="submit" class="btn btn-primary w-100">Sign up</button>
			</form>
		</div>

		<div class="card-body text-center" style="border-top: 1px solid #444">
			<p class="small text-white">
				Already have an account?
				<a href="/login" class="text-primary">Log in</a>
			</p>
		</div>
	</div>
</div>

{{>footer}}
