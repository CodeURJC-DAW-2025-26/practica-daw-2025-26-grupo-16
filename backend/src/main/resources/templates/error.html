<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerGym - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body
    class="background-image"
    style="background-image: url('/assets/images/background.png'); background-size: cover; background-position: center; background-repeat: repeat-y;"
>
    <header class="header">
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <span class="logo">⚡ PowerGym</span>
                <div class="ms-auto d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0">
                    <a href="/" class="btn btn-primary">Home</a>
                    <a href="/nutritions" class="btn btn-primary">Nutritions</a>
                    <a href="/trainings" class="btn btn-primary">Trainings</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container-center">
        <section class="card" style="max-width: 720px; width: 100%;">
            <h2 class="text-center mt-2 mb-4">Oops! Something went wrong.</h2>

            <div class="alert alert-danger text-center">
                <h4>Error {{status}} - {{error}}</h4>
                <p>{{#message}}{{message}}{{/message}}{{^message}}Unexpected request error{{/message}}</p>
            </div>

            <div class="text-center">
                <a href="/" class="btn btn-primary">Return to Home</a>
            </div>
        </section>
    </main>

    <footer class="footer-full">
        <div>© 2026 PowerGym</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
