{{>header}}

<div class="container-center">
	<div class="card" style="max-width: 420px; width: 100%; margin: 50px auto">
		<h1 class="background-title">⚡POWERGYM</h1>
		<div class="card-body">
			<h3 class="text-center mb-3 text-white">Welcome back!</h3>
			<form id="loginForm" action="/login" method="POST">
				<div class="mb-3">
					<label class="form-label">Username <small>(prefix of your email)</small></label>
					<input
						type="text"
						name="username"
						class="form-control"
						placeholder="username"
						required
					/>
				</div>
				<div class="mb-3">
					<label class="form-label">Password</label>
					<input
						type="password"
						name="password"
						class="form-control"
						placeholder="********"
						required
					/>
				</div>

				{{#token}}
				<input type="hidden" name="_csrf" value="{{token}}" />
				{{/token}}

				<button type="submit" class="btn btn-primary w-100">Log in</button>
			</form>
		</div>
		<div class="card-body text-center" style="border-top: 1px solid #444">
			<p class="small text-white">
				Don't have an account?
				<a href="/register" class="text-primary">Sign up</a>
			</p>
		</div>
	</div>
</div>

{{>footer}}
