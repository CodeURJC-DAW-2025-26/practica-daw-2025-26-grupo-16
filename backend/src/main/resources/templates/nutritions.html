{{>header}}

<main class="container nutrition-page">
	<h2 class="text-center mt-5 mb-4">Nutrition Plans</h2>
	<br />
	<div id="nutritionsGrid" class="grid grid-3">
		{{#nutritions}}
		<div class="card">
			<div class="card-header">{{name}}</div>
			{{#image}}
			<img src="/images/{{id}}" class="card-img" alt="{{name}}" />
			{{/image}} {{^image}}
			<img src="/assets/images/no_image.png" class="card-img" alt="No image" />
			{{/image}}
			<div class="card-header">
				Meals:
				<br />
				{{description}}
				<br />
				<br />
				<div class="mt-3 text-center">
					<a href="/nutritions/{{id}}" class="btn btn-primary"> More info </a>
				</div>
			</div>
		</div>
		{{/nutritions}}
	</div>

	<div class="btn-row" style="justify-content: center; margin-top: 2rem;">
		<div class="btn-btn primary">
			<button
				id="loadMoreNutritionsBtn"
				class="btn btn-primary"
				data-endpoint="/nutritions/page"
				data-page-size="{{nutritionsPageSize}}"
				data-next-page="1"
				{{^hasMoreNutritions}}style="display: none;"{{/hasMoreNutritions}}
			>
				Load More
				<span id="loadMoreNutritionsBtnSpinner" class="spinner-border spinner-border-sm ms-2" style="display: none;" role="status" aria-hidden="true"></span>
			</button>
		</div>

		{{#logged}}
		<div class="btn-btn primary">
			<a href="/createNutrition" class="btn btn-primary">Add nutrition</a>
		</div>
		{{/logged}}
	</div>
</main>

<script src="/js/load-more.js"></script>

{{>footer}}
