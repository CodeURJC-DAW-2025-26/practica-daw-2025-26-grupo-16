{{>header}}

<main class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <h2 class="text-center mt-5 mb-4">User Management</h2>

      <div class="card mb-3">
        <div class="card-body">
          <label class="form-label fw-bold">Users</label>

          {{#users}}
          <div class="card mb-2">
            <div class="card-body d-flex justify-content-between align-items-center">
              <div>
                <h6 class="mb-1 text-white">{{displayName}}</h6>
                <p class="mb-0 text-white">{{email}}</p>
              </div>
              <a href="/admin/users/{{id}}" class="btn btn-sm btn-primary">View profile</a>
            </div>
          </div>
          {{/users}}

          {{^users}}
          <p class="text-white mb-0">There are no users registered</p>
          {{/users}}
        </div>
      </div>
    </div>
  </div>
</main>

{{>footer}}
