<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Details - PowerGym</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>

    <header class="header">
      <nav class="navbar">
        <div class="logo">⚡ PowerGym</div>
        <ul class="nav-menu">
          <li><a href="home.html" class="nav-link">Home</a></li>
          <li><a href="nutrition.html" class="nav-link">Nutritions</a></li>
          <li><a href="training-detail.html" class="nav-link active">Trainings</a></li>
          <li><a href="progress.html" class="nav-link">Progress</a></li>
          <li><a href="profile-user.html" class="nav-link">Profile</a></li>
          <li><a href="login.html" class="nav-link">Log out</a></li>
        </ul>
      </nav>
    </header>

    <main class="container mt-5">

      <h2 class="text-center mb-4">Training Details</h2>

      <div class="diet-container">
        <div class="diet-image">
          <div class="card mb-4">
            <label class="form-label fw-bold">Training Image</label>
            <img src="../images/chest.png" alt="Training image" class="card-img-top" />
          </div>
        </div>

        <div class="diet-info">

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Name</label>
              <p class="form-control">Chest Plan</p>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Duration</label>
              <p class="form-control">60</p>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Goal</label>
              <p class="form-control">Increase volume</p>
            </div>
          </div>

          <div class="card mb-4">
            <div class="card-body">
              <label class="form-label fw-bold">Exercises</label>
              <textarea class="form-control" rows="6" readonly>
Press de banca : 4x8-10
Press inclinado con mancuernas: 4x10
Fondos en paralelas: 3x10
Cruces en polea: 4x12
              </textarea>
            </div>
          </div>

          <div class="btn-row">
            <a href="#" class="btn btn-primary">Add Comment</a>
            <button class="btn btn-primary">Subscribe</button>
            <a href="comments.html" class="btn btn-primary">View Comments</a>
            <button class="btn btn-primary">Edit</button>
            <button class="btn btn-primary">Delete</button>
            <a href="trainings.html" class="btn btn-primary">Return</a>
            <a href="#" class="btn btn-primary">Download PDF</a>
          </div>

        </div>
      </div>

    </main>

    <footer class="footer-full">
        <div>© 2026 PowerGym</div>
        <div>
            <a href="#">Privacy</a>
            <span class="mx-1">&middot;</span>
            <a href="#">Terms</a>
            <span class="mx-1">&middot;</span>
            <a href="#">FAQ</a>
        </div>
    </footer>

  </body>
</html>
