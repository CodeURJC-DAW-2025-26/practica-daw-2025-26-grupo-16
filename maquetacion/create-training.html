<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Crear Plan de Entrenamiento - PowerGym</title>
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<!-- Header -->
		<header class="header">
			<nav class="navbar">
				<div class="logo">⚡ PowerGym</div>
				<ul class="nav-menu">
					<li><a href="home.html" class="nav-link">Inicio</a></li>
					<li>
						<a href="nutrition-details.html" class="nav-link">Nutrición</a>
					</li>
					<li>
						<a href="create-training.html" class="nav-link active"
							>Entrenamientos</a
						>
					</li>
					<li><a href="progress.html" class="nav-link">Progreso</a></li>
					<li><a href="profile-user.html" class="nav-link">Mi Perfil</a></li>
					<li><a href="login.html" class="nav-link">Salir</a></li>
				</ul>
			</nav>
		</header>

		<!-- Main Content -->
		<main class="container dashboard-container">
			<h1 class="page-title">Crear Nuevo Entrenamiento</h1>

			<div class="card">
				<div class="card-header">Información del Entrenamiento</div>
				<div class="card-body">
					<form id="trainingForm">
						<div class="grid grid-2">
							<div class="form-group">
								<label for="trainingName" class="form-label"
									>Nombre del Entrenamiento</label
								>
								<input
									type="text"
									id="trainingName"
									class="form-control"
									placeholder="Ej: Rutina de Fuerza - Día 1"
									required
								/>
							</div>

							<div class="form-group">
								<label for="trainingType" class="form-label"
									>Tipo de Entrenamiento</label
								>
								<select id="trainingType" class="form-control" required>
									<option value="">Selecciona un tipo...</option>
									<option value="strength">Fuerza</option>
									<option value="cardio">Cardio</option>
									<option value="hiit">HIIT</option>
									<option value="yoga">Yoga</option>
									<option value="crossfit">CrossFit</option>
									<option value="calisthenics">Calistenia</option>
									<option value="mixed">Mixto</option>
								</select>
							</div>
						</div>

						<div class="grid grid-3">
							<div class="form-group">
								<label for="duration" class="form-label"
									>Duración (minutos)</label
								>
								<input
									type="number"
									id="duration"
									class="form-control"
									placeholder="45"
									min="5"
									max="180"
									required
								/>
							</div>

							<div class="form-group">
								<label for="difficulty" class="form-label">Dificultad</label>
								<select id="difficulty" class="form-control" required>
									<option value="">Selecciona...</option>
									<option value="beginner">Principiante</option>
									<option value="intermediate">Intermedio</option>
									<option value="advanced">Avanzado</option>
								</select>
							</div>

							<div class="form-group">
								<label for="calories" class="form-label"
									>Calorías Estimadas</label
								>
								<input
									type="number"
									id="calories"
									class="form-control"
									placeholder="320"
								/>
							</div>
						</div>

						<div class="form-group">
							<label for="description" class="form-label">Descripción</label>
							<textarea
								id="description"
								class="form-control"
								rows="3"
								placeholder="Describe el objetivo y características del entrenamiento..."
							></textarea>
						</div>

						<h3 class="mt-4 mb-3">Ejercicios</h3>

						<div id="exercisesList">
							<!-- Ejercicio 1 -->
							<div class="card mb-3 exercise-item">
								<div
									class="card-header"
									style="
										background: var(--bg-secondary);
										color: var(--navy-blue);
									"
								>
									<div class="flex-between">
										<span>Ejercicio 1</span>
										<button
											type="button"
											class="btn btn-danger btn-small"
											onclick="removeExercise(this)"
										>
											Eliminar
										</button>
									</div>
								</div>
								<div class="card-body">
									<div class="grid grid-2">
										<div class="form-group">
											<label class="form-label">Nombre del Ejercicio</label>
											<input
												type="text"
												class="form-control"
												placeholder="Ej: Sentadillas"
												required
											/>
										</div>

										<div class="form-group">
											<label class="form-label">Grupo Muscular</label>
											<select class="form-control">
												<option value="">Selecciona...</option>
												<option value="legs">Piernas</option>
												<option value="chest">Pecho</option>
												<option value="back">Espalda</option>
												<option value="shoulders">Hombros</option>
												<option value="arms">Brazos</option>
												<option value="core">Core</option>
												<option value="full-body">Cuerpo completo</option>
											</select>
										</div>
									</div>

									<div class="grid grid-3">
										<div class="form-group">
											<label class="form-label">Series</label>
											<input
												type="number"
												class="form-control"
												placeholder="3"
												min="1"
											/>
										</div>

										<div class="form-group">
											<label class="form-label">Repeticiones</label>
											<input
												type="text"
												class="form-control"
												placeholder="12-15"
											/>
										</div>

										<div class="form-group">
											<label class="form-label">Descanso (seg)</label>
											<input
												type="number"
												class="form-control"
												placeholder="60"
											/>
										</div>
									</div>

									<div class="form-group">
										<label class="form-label">Notas</label>
										<textarea
											class="form-control"
											rows="2"
											placeholder="Instrucciones específicas, técnica, peso recomendado..."
										></textarea>
									</div>
								</div>
							</div>

							<!-- Ejercicio 2 -->
							<div class="card mb-3 exercise-item">
								<div
									class="card-header"
									style="
										background: var(--bg-secondary);
										color: var(--navy-blue);
									"
								>
									<div class="flex-between">
										<span>Ejercicio 2</span>
										<button
											type="button"
											class="btn btn-danger btn-small"
											onclick="removeExercise(this)"
										>
											Eliminar
										</button>
									</div>
								</div>
								<div class="card-body">
									<div class="grid grid-2">
										<div class="form-group">
											<label class="form-label">Nombre del Ejercicio</label>
											<input
												type="text"
												class="form-control"
												placeholder="Ej: Press de Banca"
											/>
										</div>

										<div class="form-group">
											<label class="form-label">Grupo Muscular</label>
											<select class="form-control">
												<option value="">Selecciona...</option>
												<option value="legs">Piernas</option>
												<option value="chest">Pecho</option>
												<option value="back">Espalda</option>
												<option value="shoulders">Hombros</option>
												<option value="arms">Brazos</option>
												<option value="core">Core</option>
												<option value="full-body">Cuerpo completo</option>
											</select>
										</div>
									</div>

									<div class="grid grid-3">
										<div class="form-group">
											<label class="form-label">Series</label>
											<input
												type="number"
												class="form-control"
												placeholder="4"
												min="1"
											/>
										</div>

										<div class="form-group">
											<label class="form-label">Repeticiones</label>
											<input
												type="text"
												class="form-control"
												placeholder="8-10"
											/>
										</div>

										<div class="form-group">
											<label class="form-label">Descanso (seg)</label>
											<input
												type="number"
												class="form-control"
												placeholder="90"
											/>
										</div>
									</div>

									<div class="form-group">
										<label class="form-label">Notas</label>
										<textarea
											class="form-control"
											rows="2"
											placeholder="Instrucciones específicas, técnica, peso recomendado..."
										></textarea>
									</div>
								</div>
							</div>
						</div>

						<button
							type="button"
							class="btn btn-secondary mb-4"
							onclick="addExercise()"
						>
							+ Añadir Ejercicio
						</button>

						<div class="form-group">
							<label class="form-label"
								>Notas Generales del Entrenamiento</label
							>
							<textarea
								class="form-control"
								rows="3"
								placeholder="Calentamiento, enfriamiento, consejos generales..."
							></textarea>
						</div>

						<div class="flex gap-2">
							<button type="submit" class="btn btn-primary">
								Crear Entrenamiento
							</button>
							<button
								type="button"
								class="btn btn-secondary"
								onclick="window.history.back()"
							>
								Cancelar
							</button>
						</div>
					</form>
				</div>
			</div>
		</main>

		<script>
			let exerciseCount = 2;

			function addExercise() {
				exerciseCount++;
				const exercisesList = document.getElementById('exercisesList');
				const newExercise = `
                <div class="card mb-3 exercise-item">
                    <div class="card-header" style="background: var(--bg-secondary); color: var(--navy-blue);">
                        <div class="flex-between">
                            <span>Ejercicio ${exerciseCount}</span>
                            <button type="button" class="btn btn-danger btn-small" onclick="removeExercise(this)">Eliminar</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="grid grid-2">
                            <div class="form-group">
                                <label class="form-label">Nombre del Ejercicio</label>
                                <input type="text" class="form-control" placeholder="Ej: Dominadas">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Grupo Muscular</label>
                                <select class="form-control">
                                    <option value="">Selecciona...</option>
                                    <option value="legs">Piernas</option>
                                    <option value="chest">Pecho</option>
                                    <option value="back">Espalda</option>
                                    <option value="shoulders">Hombros</option>
                                    <option value="arms">Brazos</option>
                                    <option value="core">Core</option>
                                    <option value="full-body">Cuerpo completo</option>
                                </select>
                            </div>
                        </div>
                        <div class="grid grid-3">
                            <div class="form-group">
                                <label class="form-label">Series</label>
                                <input type="number" class="form-control" placeholder="3" min="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Repeticiones</label>
                                <input type="text" class="form-control" placeholder="10-12">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Descanso (seg)</label>
                                <input type="number" class="form-control" placeholder="60">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Notas</label>
                            <textarea class="form-control" rows="2" placeholder="Instrucciones específicas..."></textarea>
                        </div>
                    </div>
                </div>
            `;
				exercisesList.insertAdjacentHTML('beforeend', newExercise);
			}

			function removeExercise(button) {
				const exerciseItem = button.closest('.exercise-item');
				exerciseItem.remove();
				updateExerciseNumbers();
			}

			function updateExerciseNumbers() {
				const exercises = document.querySelectorAll('.exercise-item');
				exercises.forEach((exercise, index) => {
					exercise.querySelector('.card-header span').textContent =
						`Ejercicio ${index + 1}`;
				});
				exerciseCount = exercises.length;
			}

			document
				.getElementById('trainingForm')
				.addEventListener('submit', function (e) {
					e.preventDefault();
					alert('Entrenamiento creado exitosamente');
					window.location.href = 'home.html';
				});
		</script>
	</body>
</html>
