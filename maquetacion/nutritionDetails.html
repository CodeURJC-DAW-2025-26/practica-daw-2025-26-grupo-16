        <span class="logo">⚡ PowerGym</span>

        <button
          class="navbar-toggler"
          type="button"

          aria-controls="powergymNav"
          aria-expanded="false"

    </header>

    
    <main class="container mt-5">

      <h2 class="text-center mt-5 mb-4">Diet Details</h2>

      <div class="diet-container">

        <div class="diet-image">
      		<div class="card mb-4">
				<label class="form-label fw-bold">Diet Image</label>
        		<img src="../images/maintenance-diet.png" alt="Imagen dieta" class="card-img-top" />
      		</div>
    	</div>

        <div class="diet-info">
          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Name</label>
              <p class="form-control">Maintenance Diet</p>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Number of Calories</label>
              <p class="form-control">2450 kcal</p>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Goal</label>
              <p class="form-control">Maintain weight</p>
            </div>
          </div>

          <div class="card mb-4">
            <div class="card-body">
              <label class="form-label fw-bold">Meals of the Day</label>
              <textarea class="form-control" rows="6" readonly>
Breakfast: 2 scrambled eggs + 50 g oats
Lunch: 150 g chicken + salad with oil
Snack: Plain Greek yoghurt with almonds
Dinner: 120 g salmon + sautéed vegetables
              </textarea>
            </div>
          </div>

          
          <div class="btn-row">
			<a href="#" class="btn btn-primary">Add Comment</a>
			<button class="btn btn-primary">Subscribe</button>
			<a href="comments.html" class="btn btn-primary">View Comments</a>
			<a href="editNutrition.html" class="btn btn-primary">Edit</a>
			<button class="btn btn-primary">Delete</button>
			<a href="nutritions.html" class="btn btn-primary">Return</a>
			<a href="#" class="btn btn-primary">Download PDF</a>
		  </div>
        </div>
      </div>

    </main>
