<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Socio - PowerGym</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #0ea5e9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1 class="auth-title">Hazte Socio de PowerGym</h1>
                <p class="auth-subtitle">Completa el formulario para unirte a nuestro gimnasio</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="grid grid-2">
                    <div class="form-group">
                        <label for="firstName" class="form-label">Nombre</label>
                        <input 
                            type="text" 
                            id="firstName" 
                            class="form-control" 
                            placeholder="Juan"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastName" class="form-label">Apellidos</label>
                        <input 
                            type="text" 
                            id="lastName" 
                            class="form-control" 
                            placeholder="García López"
                            required
                        >
                    </div>
                </div>

                <div class="grid grid-2">
                    <div class="form-group">
                        <label for="dni" class="form-label">DNI</label>
                        <input 
                            type="text" 
                            id="dni" 
                            class="form-control" 
                            placeholder="12345678A"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">Teléfono</label>
                        <input 
                            type="tel" 
                            id="phone" 
                            class="form-control" 
                            placeholder="666 123 456"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="tu@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="••••••••"
                        required
                    >
                    <small class="form-help">Mínimo 8 caracteres</small>
                </div>

                <div class="grid grid-3">
                    <div class="form-group">
                        <label for="age" class="form-label">Fecha Nacimiento</label>
                        <input 
                            type="date" 
                            id="age" 
                            class="form-control" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="gender" class="form-label">Género</label>
                        <select id="gender" class="form-control" required>
                            <option value="">Selecciona...</option>
                            <option value="male">Masculino</option>
                            <option value="female">Femenino</option>
                            <option value="other">Otro</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="membership" class="form-label">Tipo de Membresía</label>
                        <select id="membership" class="form-control" required>
                            <option value="">Selecciona...</option>
                            <option value="basic">Básica (30€/mes)</option>
                            <option value="standard">Estándar (45€/mes)</option>
                            <option value="premium">Premium (60€/mes)</option>
                            <option value="annual">Anual (500€/año)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Objetivos (opcional)</label>
                    <textarea 
                        class="form-control" 
                        rows="2"
                        placeholder="Ej: Perder peso, ganar músculo, mejorar resistencia..."
                    ></textarea>
                </div>

                <div class="form-group">
                    <label class="flex gap-1">
                        <input type="checkbox" name="terms" required>
                        <span>Acepto los <a href="#">términos y condiciones</a> y la política de privacidad</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Completar Registro</button>
            </form>

            <div class="auth-footer">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
                <p><a href="index.html">← Volver a inicio</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('¡Registro completado! Bienvenido a PowerGym');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
