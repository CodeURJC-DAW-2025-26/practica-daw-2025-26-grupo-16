<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Editar Plan Nutricional - PowerGym</title>
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<!-- Header -->
		<header class="header">
			<nav class="navbar">
				<div class="logo">⚡ PowerGym</div>
				<ul class="nav-menu">
					<li><a href="home.html" class="nav-link">Inicio</a></li>
					<li>
						<a href="nutrition-details.html" class="nav-link active"
							>Nutrición</a
						>
					</li>
					<li>
						<a href="create-training.html" class="nav-link">Entrenamientos</a>
					</li>
					<li><a href="progress.html" class="nav-link">Progreso</a></li>
					<li><a href="profile-user.html" class="nav-link">Mi Perfil</a></li>
					<li><a href="login.html" class="nav-link">Salir</a></li>
				</ul>
			</nav>
		</header>

		<!-- Main Content -->
		<main class="container dashboard-container">
			<div class="flex-between mb-4">
				<h1 class="page-title" style="margin-bottom: 0">
					Editar Plan Nutricional
				</h1>
				<a href="nutrition-details.html" class="btn btn-secondary"
					>Volver sin Guardar</a
				>
			</div>

			<div class="card">
				<div class="card-header">Información del Plan</div>
				<div class="card-body">
					<form id="editNutritionForm">
						<div class="grid grid-2">
							<div class="form-group">
								<label for="planName" class="form-label">Nombre del Plan</label>
								<input
									type="text"
									id="planName"
									class="form-control"
									value="Dieta Balanceada"
									required
								/>
							</div>

							<div class="form-group">
								<label for="planType" class="form-label">Tipo de Plan</label>
								<select id="planType" class="form-control" required>
									<option value="weight-loss" selected>Pérdida de peso</option>
									<option value="muscle-gain">Ganancia muscular</option>
									<option value="maintenance">Mantenimiento</option>
									<option value="definition">Definición</option>
									<option value="vegetarian">Vegetariano</option>
									<option value="vegan">Vegano</option>
									<option value="keto">Cetogénica</option>
								</select>
							</div>
						</div>

						<div class="form-group">
							<label for="description" class="form-label">Descripción</label>
							<textarea id="description" class="form-control" rows="3">
Plan nutricional balanceado diseñado para pérdida de peso gradual manteniendo la masa muscular. Incluye macronutrientes balanceados y variedad de alimentos saludables.</textarea
							>
						</div>

						<div class="grid grid-4">
							<div class="form-group">
								<label for="calories" class="form-label"
									>Calorías Diarias</label
								>
								<input
									type="number"
									id="calories"
									class="form-control"
									value="2450"
									required
								/>
							</div>

							<div class="form-group">
								<label for="proteins" class="form-label">Proteínas (g)</label>
								<input
									type="number"
									id="proteins"
									class="form-control"
									value="200"
									required
								/>
							</div>

							<div class="form-group">
								<label for="carbs" class="form-label">Carbohidratos (g)</label>
								<input
									type="number"
									id="carbs"
									class="form-control"
									value="280"
									required
								/>
							</div>

							<div class="form-group">
								<label for="fats" class="form-label">Grasas (g)</label>
								<input
									type="number"
									id="fats"
									class="form-control"
									value="65"
									required
								/>
							</div>
						</div>

						<h3 class="mt-4 mb-3">Editar Comidas del Día</h3>

						<!-- Desayuno -->
						<div class="card mb-3">
							<div
								class="card-header"
								style="background: var(--bg-secondary); color: var(--navy-blue)"
							>
								🌅 Desayuno
							</div>
							<div class="card-body">
								<div class="form-group">
									<label class="form-label">Alimentos</label>
									<textarea class="form-control" rows="3">
3 huevos revueltos
2 tostadas integrales
1 plátano mediano
1 taza de café negro</textarea
									>
								</div>
								<div class="grid grid-4">
									<div class="form-group">
										<label class="form-label">Calorías</label>
										<input type="number" class="form-control" value="450" />
									</div>
									<div class="form-group">
										<label class="form-label">Proteínas (g)</label>
										<input type="number" class="form-control" value="25" />
									</div>
									<div class="form-group">
										<label class="form-label">Carbohidratos (g)</label>
										<input type="number" class="form-control" value="45" />
									</div>
									<div class="form-group">
										<label class="form-label">Grasas (g)</label>
										<input type="number" class="form-control" value="15" />
									</div>
								</div>
							</div>
						</div>

						<!-- Snack Mañana -->
						<div class="card mb-3">
							<div
								class="card-header"
								style="background: var(--bg-secondary); color: var(--navy-blue)"
							>
								🍎 Snack Media Mañana
							</div>
							<div class="card-body">
								<div class="form-group">
									<label class="form-label">Alimentos</label>
									<textarea class="form-control" rows="2">
1 manzana
30g de almendras</textarea
									>
								</div>
								<div class="grid grid-4">
									<div class="form-group">
										<label class="form-label">Calorías</label>
										<input type="number" class="form-control" value="250" />
									</div>
									<div class="form-group">
										<label class="form-label">Proteínas (g)</label>
										<input type="number" class="form-control" value="8" />
									</div>
									<div class="form-group">
										<label class="form-label">Carbohidratos (g)</label>
										<input type="number" class="form-control" value="28" />
									</div>
									<div class="form-group">
										<label class="form-label">Grasas (g)</label>
										<input type="number" class="form-control" value="14" />
									</div>
								</div>
							</div>
						</div>

						<!-- Almuerzo -->
						<div class="card mb-3">
							<div
								class="card-header"
								style="background: var(--bg-secondary); color: var(--navy-blue)"
							>
								🍽️ Almuerzo
							</div>
							<div class="card-body">
								<div class="form-group">
									<label class="form-label">Alimentos</label>
									<textarea class="form-control" rows="4">
200g pechuga de pollo a la plancha
150g arroz integral cocido
Ensalada mixta con aceite de oliva
1 yogur griego natural</textarea
									>
								</div>
								<div class="grid grid-4">
									<div class="form-group">
										<label class="form-label">Calorías</label>
										<input type="number" class="form-control" value="680" />
									</div>
									<div class="form-group">
										<label class="form-label">Proteínas (g)</label>
										<input type="number" class="form-control" value="58" />
									</div>
									<div class="form-group">
										<label class="form-label">Carbohidratos (g)</label>
										<input type="number" class="form-control" value="72" />
									</div>
									<div class="form-group">
										<label class="form-label">Grasas (g)</label>
										<input type="number" class="form-control" value="16" />
									</div>
								</div>
							</div>
						</div>

						<!-- Snack Tarde -->
						<div class="card mb-3">
							<div
								class="card-header"
								style="background: var(--bg-secondary); color: var(--navy-blue)"
							>
								🥤 Snack Tarde
							</div>
							<div class="card-body">
								<div class="form-group">
									<label class="form-label">Alimentos</label>
									<textarea class="form-control" rows="2">
Batido de proteína (30g)
1 plátano</textarea
									>
								</div>
								<div class="grid grid-4">
									<div class="form-group">
										<label class="form-label">Calorías</label>
										<input type="number" class="form-control" value="280" />
									</div>
									<div class="form-group">
										<label class="form-label">Proteínas (g)</label>
										<input type="number" class="form-control" value="32" />
									</div>
									<div class="form-group">
										<label class="form-label">Carbohidratos (g)</label>
										<input type="number" class="form-control" value="38" />
									</div>
									<div class="form-group">
										<label class="form-label">Grasas (g)</label>
										<input type="number" class="form-control" value="3" />
									</div>
								</div>
							</div>
						</div>

						<!-- Cena -->
						<div class="card mb-3">
							<div
								class="card-header"
								style="background: var(--bg-secondary); color: var(--navy-blue)"
							>
								🌙 Cena
							</div>
							<div class="card-body">
								<div class="form-group">
									<label class="form-label">Alimentos</label>
									<textarea class="form-control" rows="4">
200g salmón a la plancha
250g verduras al vapor (brócoli, zanahoria)
100g boniato asado
Ensalada verde</textarea
									>
								</div>
								<div class="grid grid-4">
									<div class="form-group">
										<label class="form-label">Calorías</label>
										<input type="number" class="form-control" value="550" />
									</div>
									<div class="form-group">
										<label class="form-label">Proteínas (g)</label>
										<input type="number" class="form-control" value="48" />
									</div>
									<div class="form-group">
										<label class="form-label">Carbohidratos (g)</label>
										<input type="number" class="form-control" value="42" />
									</div>
									<div class="form-group">
										<label class="form-label">Grasas (g)</label>
										<input type="number" class="form-control" value="22" />
									</div>
								</div>
							</div>
						</div>

						<div class="form-group">
							<label class="form-label">Notas y Recomendaciones</label>
							<textarea class="form-control" rows="4">
- Beber al menos 2.5 litros de agua al día
- Ajustar las porciones según el nivel de actividad diaria
- Consumir las comidas en los horarios indicados para mantener el metabolismo activo
- Los snacks son opcionales si no se siente hambre</textarea
							>
						</div>

						<div class="flex gap-2 mt-4">
							<button type="submit" class="btn btn-primary btn-large">
								Guardar Cambios
							</button>
							<a
								href="nutrition-details.html"
								class="btn btn-secondary btn-large"
								>Cancelar</a
							>
							<button
								type="button"
								class="btn btn-danger btn-large"
								style="margin-left: auto"
							>
								Eliminar Plan
							</button>
						</div>
					</form>
				</div>
			</div>
		</main>

		<script>
			document
				.getElementById('editNutritionForm')
				.addEventListener('submit', function (e) {
					e.preventDefault();

					if (confirm('¿Deseas guardar los cambios realizados?')) {
						alert('Plan nutricional actualizado exitosamente');
						window.location.href = 'nutrition-details.html';
					}
				});
		</script>
	</body>
</html>
