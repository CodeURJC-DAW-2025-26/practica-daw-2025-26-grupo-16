<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerGym</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="background-image">

    <header class="header">
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">

        <span class="logo">⚡ PowerGym</span>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#powergymNav"
          aria-controls="powergymNav"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="powergymNav">
          <div class="ms-auto d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0">

            <a href="index.html" class="btn btn-primary">Home</a>
            <a href="nutritions.html" class="btn btn-primary">Nutritions</a>
            <a href="trainings.html" class="btn btn-primary">Trainings</a>
            <a href="progress.html" class="btn btn-primary">Progress</a>
            <a href="profileUser.html" class="btn btn-primary">Profile</a>
            <a href="login.html" class="btn btn-primary">Log in</a>

          </div>
        </div>

      </div>
    </nav>
    </header>

    <main class="pg-container mt-5">

      <h2 class="text-center mt-5 mb-4">Training Details</h2>

      <div class="diet-container">
        <div class="diet-image">
          <div class="card mb-4">
            <label class="form-label fw-bold">Training Image</label>
            <img src="../images/chest.png" alt="Training image" class="card-img-top" />
          </div>
        </div>

        <div class="diet-info">

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Name</label>
              <p class="form-control">Chest Plan</p>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Duration</label>
              <p class="form-control">60</p>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Goal</label>
              <p class="form-control">Increase weigth</p>
            </div>
          </div>

          <div class="card mb-4">
            <div class="card-body">
              <label class="form-label fw-bold">Exercises</label>
              <textarea class="form-control" rows="6" readonly>
Bench press: 4x8-10
Incline dumbbell press: 4x10
Parallel bar dips: 3x10
Pulley crossovers: 4x12
              </textarea>
            </div>
          </div>

          <div class="btn-row">
            <a href="#" class="btn btn-primary">Add Comment</a>
            <button class="btn btn-primary">Subscribe</button>
            <a href="comments.html" class="btn btn-primary">View Comments</a>
            <a href="editTraining.html" class="btn btn-primary">Edit</a>
            <button class="btn btn-primary">Delete</button>
            <a href="trainings.html" class="btn btn-primary">Return</a>
            <a href="#" class="btn btn-primary">Download PDF</a>
          </div>

        </div>
      </div>

    </main>

    <footer class="footer-full">
        <div>© 2026 PowerGym</div>
        <div>
            <a href="#">Privacy</a>
            <span class="mx-1">&middot;</span>
            <a href="#">Terms</a>
            <span class="mx-1">&middot;</span>
            <a href="#">FAQ</a>
        </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

  </body>
</html>
