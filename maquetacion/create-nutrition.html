<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Crear Plan Nutricional - PowerGym</title>
		<link rel="stylesheet" href="css/styles.css" />
	</head>
	<body>
		<!-- Header -->
		<header class="header">
			<nav class="navbar">
				<div class="logo">⚡ PowerGym</div>
				<ul class="nav-menu">
					<li><a href="home.html" class="nav-link">Inicio</a></li>
					<li>
						<a href="nutrition-details.html" class="nav-link active"
							>Nutrición</a
						>
					</li>
					<li>
						<a href="create-training.html" class="nav-link">Entrenamientos</a>
					</li>
					<li><a href="progress.html" class="nav-link">Progreso</a></li>
					<li><a href="profile-user.html" class="nav-link">Mi Perfil</a></li>
					<li><a href="login.html" class="nav-link">Salir</a></li>
				</ul>
			</nav>
		</header>

		<!-- Main Content -->
		<main class="container dashboard-container">
			<h1 class="page-title">Crear Plan Nutricional</h1>

			<div class="card">
				<div class="card-header">Información del Plan</div>
				<div class="card-body">
					<form id="nutritionForm">
						<div class="grid grid-2">
							<div class="form-group">
								<label for="planName" class="form-label">Nombre del Plan</label>
								<input
									type="text"
									id="planName"
									class="form-control"
									placeholder="Ej: Dieta Balanceada"
									required
								/>
							</div>

							<div class="form-group">
								<label for="planType" class="form-label">Tipo de Plan</label>
								<select id="planType" class="form-control" required>
									<option value="">Selecciona un tipo...</option>
									<option value="weight-loss">Pérdida de peso</option>
									<option value="muscle-gain">Ganancia muscular</option>
									<option value="maintenance">Mantenimiento</option>
									<option value="definition">Definición</option>
									<option value="vegetarian">Vegetariano</option>
									<option value="vegan">Vegano</option>
									<option value="keto">Cetogénica</option>
								</select>
							</div>
						</div>

						<div class="form-group">
							<label for="description" class="form-label">Descripción</label>
							<textarea
								id="description"
								class="form-control"
								rows="3"
								placeholder="Describe los objetivos y características del plan..."
							></textarea>
						</div>

						<div class="grid grid-4">
							<div class="form-group">
								<label for="calories" class="form-label"
									>Calorías Diarias</label
								>
								<input
									type="number"
									id="calories"
									class="form-control"
									placeholder="2450"
									min="1000"
									max="5000"
									required
								/>
							</div>

							<div class="form-group">
								<label for="proteins" class="form-label">Proteínas (g)</label>
								<input
									type="number"
									id="proteins"
									class="form-control"
									placeholder="200"
									required
								/>
							</div>

							<div class="form-group">
								<label for="carbs" class="form-label">Carbohidratos (g)</label>
								<input
									type="number"
									id="carbs"
									class="form-control"
									placeholder="280"
									required
								/>
							</div>

							<div class="form-group">
								<label for="fats" class="form-label">Grasas (g)</label>
								<input
									type="number"
									id="fats"
									class="form-control"
									placeholder="65"
									required
								/>
							</div>
						</div>

						<h3 class="mt-4 mb-3">Comidas del Día</h3>

						<!-- Desayuno -->
						<div class="card mb-3">
							<div
								class="card-header"
								style="background: var(--bg-secondary); color: var(--navy-blue)"
							>
								Desayuno
							</div>
							<div class="card-body">
								<div class="form-group">
									<label class="form-label">Alimentos</label>
									<textarea
										class="form-control"
										rows="2"
										placeholder="Ej: 3 huevos revueltos, 1 tostada integral, 1 plátano"
									></textarea>
								</div>
								<div class="grid grid-4">
									<div class="form-group">
										<label class="form-label">Calorías</label>
										<input
											type="number"
											class="form-control"
											placeholder="450"
										/>
									</div>
									<div class="form-group">
										<label class="form-label">Proteínas (g)</label>
										<input
											type="number"
											class="form-control"
											placeholder="25"
										/>
									</div>
									<div class="form-group">
										<label class="form-label">Carbohidratos (g)</label>
										<input
											type="number"
											class="form-control"
											placeholder="40"
										/>
									</div>
									<div class="form-group">
										<label class="form-label">Grasas (g)</label>
										<input
											type="number"
											class="form-control"
											placeholder="15"
										/>
									</div>
								</div>
							</div>
						</div>

						<!-- Almuerzo -->
						<div class="card mb-3">
							<div
								class="card-header"
								style="background: var(--bg-secondary); color: var(--navy-blue)"
							>
								Almuerzo
							</div>
							<div class="card-body">
								<div class="form-group">
									<label class="form-label">Alimentos</label>
									<textarea
										class="form-control"
										rows="2"
										placeholder="Ej: 200g pechuga de pollo, arroz integral, ensalada"
									></textarea>
								</div>
								<div class="grid grid-4">
									<div class="form-group">
										<label class="form-label">Calorías</label>
										<input
											type="number"
											class="form-control"
											placeholder="650"
										/>
									</div>
									<div class="form-group">
										<label class="form-label">Proteínas (g)</label>
										<input
											type="number"
											class="form-control"
											placeholder="50"
										/>
									</div>
									<div class="form-group">
										<label class="form-label">Carbohidratos (g)</label>
										<input
											type="number"
											class="form-control"
											placeholder="70"
										/>
									</div>
									<div class="form-group">
										<label class="form-label">Grasas (g)</label>
										<input
											type="number"
											class="form-control"
											placeholder="15"
										/>
									</div>
								</div>
							</div>
						</div>

						<!-- Cena -->
						<div class="card mb-3">
							<div
								class="card-header"
								style="background: var(--bg-secondary); color: var(--navy-blue)"
							>
								Cena
							</div>
							<div class="card-body">
								<div class="form-group">
									<label class="form-label">Alimentos</label>
									<textarea
										class="form-control"
										rows="2"
										placeholder="Ej: Salmón a la plancha, verduras al vapor"
									></textarea>
								</div>
								<div class="grid grid-4">
									<div class="form-group">
										<label class="form-label">Calorías</label>
										<input
											type="number"
											class="form-control"
											placeholder="500"
										/>
									</div>
									<div class="form-group">
										<label class="form-label">Proteínas (g)</label>
										<input
											type="number"
											class="form-control"
											placeholder="45"
										/>
									</div>
									<div class="form-group">
										<label class="form-label">Carbohidratos (g)</label>
										<input
											type="number"
											class="form-control"
											placeholder="30"
										/>
									</div>
									<div class="form-group">
										<label class="form-label">Grasas (g)</label>
										<input
											type="number"
											class="form-control"
											placeholder="20"
										/>
									</div>
								</div>
							</div>
						</div>

						<!-- Snacks -->
						<div class="card mb-4">
							<div
								class="card-header"
								style="background: var(--bg-secondary); color: var(--navy-blue)"
							>
								Snacks (opcionales)
							</div>
							<div class="card-body">
								<div class="form-group">
									<label class="form-label">Alimentos</label>
									<textarea
										class="form-control"
										rows="2"
										placeholder="Ej: Frutos secos, yogur griego, frutas"
									></textarea>
								</div>
							</div>
						</div>

						<div class="form-group">
							<label class="form-label">Notas Adicionales</label>
							<textarea
								class="form-control"
								rows="3"
								placeholder="Recomendaciones, suplementos, horarios específicos..."
							></textarea>
						</div>

						<div class="flex gap-2">
							<button type="submit" class="btn btn-primary">
								Crear Plan Nutricional
							</button>
							<button
								type="button"
								class="btn btn-secondary"
								onclick="window.history.back()"
							>
								Cancelar
							</button>
						</div>
					</form>
				</div>
			</div>
		</main>

		<script>
			document
				.getElementById('nutritionForm')
				.addEventListener('submit', function (e) {
					e.preventDefault();
					alert('Plan nutricional creado exitosamente');
					window.location.href = 'nutrition-details.html';
				});
		</script>
	</body>
</html>
