<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerGym</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="background-image">

    <header class="header">
      <nav class="navbar">
        <div class="logo">⚡ PowerGym</div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="nutritions.html" class="nav-link">Nutritions</a></li>
          <li><a href="trainings.html" class="nav-link">Trainings</a></li>
          <li><a href="progress.html" class="nav-link">Progress</a></li>
          <li><a href="profileUser.html" class="nav-link">Profile</a></li>
          <li><a href="login.html" class="nav-link">Log in</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">

      <h2 class="text-center mb-4">Create New Training</h2>

      <div class="card">
        <div class="card-header">New training</div>
        <div class="card-body">

          <form id="trainingForm">

              <div class="mb-3">
                <label class="form-label">Training Image</label>
                <input
                  type="file"
                  class="form-control"
                  accept="image/*"
                  required/>
              </div>
              <br>

            <div class="mb-3">
              <label class="form-label">Training Name</label>
              <input
                type="text"
                class="form-control"
                placeholder="Name of the training plan"
                required/>
            </div>
            <br>

            <div class="mb-3">
              <label class="form-label">Duration (minutes)</label>
              <input
                type="number"
                class="form-control"
                placeholder="Duration of the training in minutes"
                required/>
            </div>
            <br>

            <div class="mb-3">
              <label class="form-label">Training Goal</label>
              <select class="form-control" required>
                <option value="">Select an option…</option>
                <option value="gain">Increase weigth</option>
                <option value="maintain">Maintain weight</option>
                <option value="lose">Lose weight</option>
              </select>
            </div>
            <br>

            <div class="mb-4">
              <label class="form-label">Exercises of the Training</label>
              <textarea
                class="form-control"
                rows="6"
                placeholder="Bench press: 4x8-10
Incline dumbbell press: 4x10
Parallel bar dips: 3x10
Pulley crossovers: 4x12"
                required></textarea>
            </div>
          </form>

        </div>
      </div>
          <div class="grid grid-2">
              <button type="submit" class="btn btn-primary">
                          Create
              </button>
              <a href="trainings.html" class="btn btn-primary">Cancel</a>
            </div>
    </main>

    <footer class="footer-full">
        <div>© 2026 PowerGym</div>
        <div>
            <a href="#">Privacy</a>
            <span class="mx-1">&middot;</span>
            <a href="#">Terms</a>
            <span class="mx-1">&middot;</span>
            <a href="#">FAQ</a>
        </div>
    </footer>

  </body>
</html>
