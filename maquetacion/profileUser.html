<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PowerGym</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="background-image">

    <header class="header">
      <nav class="navbar">
        <div class="logo">⚡ PowerGym</div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="nutritions.html" class="nav-link">Nutritions</a></li>
          <li><a href="trainings.html" class="nav-link ">Trainings</a></li>
          <li><a href="progress.html" class="nav-link">Progress</a></li>
          <li><a href="profileUser.html" class="nav-link active">Profile</a></li>
          <li><a href="login.html" class="nav-link">Log in</a></li>
        </ul>
      </nav>
    </header>

    <main class="container mt-5">

      <h2 class="text-center mb-4">Profile User</h2>

      <div class="diet-container">
        <div class="diet-image">
          <div class="card mb-4">
            <label class="form-label fw-bold">User Image</label>
            <img src="../images/user.png" alt="User image" class="card-img-top" />
          </div>
        </div>

        <div class="diet-info">

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Name</label>
              <p class="form-control">User</p>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-body">
              <label class="form-label fw-bold">Email</label>
              <p class="form-control">user@example.com</p>
            </div>
          </div>

          <div class="card mb-3">
			<div class="card-body">
				<label class="form-label fw-bold">Trainings Subscribed</label>
				<div class="form-control text-muted text-center">
				There are no training plans added to the profile
				</div>
			</div>
		  </div>

          <div class="card mb-3">
			<div class="card-body">
				<label class="form-label fw-bold">Nutrition Subscribed</label>
				<div class="form-control text-muted text-center">
				There are no nutrition plans added to the profile
				</div>
			</div>
		  </div>

          <div class="btn-row">
            <a href="#" class="btn btn-primary">Save</a>
          </div>

        </div>
      </div>

    </main>

    <footer class="footer-full">
        <div>© 2026 PowerGym</div>
        <div>
            <a href="#">Privacy</a>
            <span class="mx-1">&middot;</span>
            <a href="#">Terms</a>
            <span class="mx-1">&middot;</span>
            <a href="#">FAQ</a>
        </div>
    </footer>

  </body>
</html>
