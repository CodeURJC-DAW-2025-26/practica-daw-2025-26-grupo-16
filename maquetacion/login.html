<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerGym</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="background-image">
    
  {{>header}}

  <main class="container-center">

    <div class="card" style="max-width: 420px; width: 100%;">

      <h1 class="background-title">⚡POWERGYM</h1>

      <div class="card-body">

        <h3 class="text-center mb-3">Welcome back!</h3>
        <br>

        <form id="loginForm" action="/login" method="POST">

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="text" name="username" class="form-control" placeholder="Username" required/>
            <br>
            <br>
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="********" required/>
          </div>

          {{#token}}
            <input type="hidden" name="_csrf" value="{{token}}" />
          {{/token}}

          <br>
          <button type="submit" class="btn btn-primary" style="width:100%;">
            Log in
          </button>

        </form>

      </div>

      <div class="card-body text-center" style="border-top:1px solid #222;">
        <p style="color:white; font-size:0.8rem;">
          Don't have an account?
          <a href="/register" style="color:var(--primary);">Sign up</a>
        </p>
      </div>

    </div>

  </main>

{{>footer}}
